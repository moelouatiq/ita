{read:'Morgen beginnt mein Arbeitstag um acht Uhr. Zuerst fahre ich mit dem Bus ins Büro. Am Nachmittag arbeite ich zu Hause, weil ich einen Arzttermin habe.',rq:['Warum arbeitet die Person am Nachmittag zu Hause?','Wegen eines Arzttermins.','Weil der Bus nicht fährt.','Wegen eines Urlaubs.'],listen:'Achtung, der Bus Nummer zwölf fährt heute nicht über den Hauptbahnhof. Fahrgäste Richtung Zentrum steigen bitte am Rathaus um.',lq:['Was müssen Fahrgäste Richtung Zentrum tun?','Am Rathaus umsteigen.','Am Hauptbahnhof warten.','Ein Taxi nehmen.']},
{read:'Sara lernt jeden Abend Deutsch, weil sie nächstes Jahr in Deutschland arbeiten möchte. Wenn sie wenig Zeit hat, wiederholt sie nur Vokabeln und hört zehn Minuten Deutsch.',rq:['Warum lernt Sara Deutsch?','Sie möchte in Deutschland arbeiten.','Sie möchte Urlaub machen.','Sie braucht einen Führerschein.'],listen:'Guten Abend. Der Deutschkurs beginnt heute ausnahmsweise um neunzehn Uhr statt um achtzehn Uhr. Der Raum bleibt derselbe: Raum 204.',lq:['Was ändert sich heute?','Die Uhrzeit.','Der Raum.','Der Lehrer.']},
{read:'Im Büro sucht Karim einen neuen Drucker. Er braucht einen Drucker mit Scanner, weil viele Dokumente digital gespeichert werden müssen. Das günstigste Modell kostet 180 Euro.',rq:['Was braucht Karim zusätzlich zum Drucker?','Einen Scanner.','Eine Kamera.','Einen Fernseher.'],listen:'Im Elektronikmarkt gibt es diese Woche zwanzig Prozent Rabatt auf Drucker. Scanner und Papier sind von der Aktion ausgeschlossen.',lq:['Worauf gibt es Rabatt?','Auf Drucker.','Auf Scanner.','Auf Papier.']},
{read:'Nadia fährt jeden Morgen mit der Straßenbahn zur Arbeit. Bei schlechtem Wetter nimmt sie nicht das Fahrrad. Nach der Arbeit fährt sie manchmal zu ihrer Schwester.',rq:['Womit fährt Nadia normalerweise zur Arbeit?','Mit der Straßenbahn.','Mit dem Fahrrad.','Mit dem Auto.'],listen:'Wegen Bauarbeiten hält die Straßenbahn heute nicht an der Haltestelle Markt. Bitte benutzen Sie die Haltestelle Theater.',lq:['Welche Haltestelle soll man benutzen?','Theater.','Markt.','Bahnhof.']},
{read:'Gestern hat Jonas lange gearbeitet. Danach hat er seine Mutter besucht und am Abend noch Deutsch gelernt. Gegen zehn Uhr ist er nach Hause gefahren.',rq:['Was hat Jonas nach der Arbeit gemacht?','Er hat seine Mutter besucht.','Er ist sofort schlafen gegangen.','Er hat Fußball gespielt.'],listen:'Frau Klein ist gestern mit dem Zug nach Köln gefahren. Wegen einer Störung ist sie erst um 21 Uhr angekommen.',lq:['Warum kam Frau Klein spät an?','Wegen einer Störung.','Wegen des Wetters.','Wegen eines Termins.']},
{read:'Beim Hören muss man nicht jedes Wort verstehen. Wichtig sind zuerst Thema, Ort, Personen und Grund. Danach kann man beim zweiten Hören auf Details achten.',rq:['Was ist beim ersten Hören besonders wichtig?','Die Hauptinformationen.','Jedes einzelne Wort.','Die Rechtschreibung.'],listen:'Hier ist eine Durchsage für Reisende nach Hamburg. Der Zug fährt heute von Gleis sieben statt von Gleis vier und hat ungefähr zehn Minuten Verspätung.',lq:['Von welchem Gleis fährt der Zug?','Von Gleis sieben.','Von Gleis vier.','Von Gleis zehn.']},
{read:'In dieser Woche wurden Wortstellung, Akkusativ, Dativ und Perfekt wiederholt. Besonders wichtig ist, die Regeln nicht nur zu erkennen, sondern sie beim Sprechen selbstständig anzuwenden.',rq:['Was ist das wichtigste Ziel der Wiederholung?','Die Regeln aktiv anwenden.','Nur Regeln lesen.','Nur Wörter abschreiben.'],listen:'Der Sprachkurs endet diese Woche mit einem kurzen Test. Wer mindestens achtzig Prozent erreicht, bekommt zusätzliche Übungen für das nächste Niveau.',lq:['Was passiert bei mindestens achtzig Prozent?','Man bekommt zusätzliche Übungen.','Man muss den Kurs verlassen.','Man zahlt mehr.']},
{read:'Mira arbeitet Vollzeit und lernt trotzdem jeden Abend Deutsch. Außerdem hört sie auf dem Weg zur Arbeit Podcasts. Deshalb versteht sie Gespräche inzwischen deutlich besser.',rq:['Warum versteht Mira Gespräche besser?','Sie übt regelmäßig.','Sie arbeitet weniger.','Sie liest keine Texte.'],listen:'Das Fitnessstudio schließt heute früher. Trotzdem findet der Deutsch-Konversationskurs wie geplant um 18 Uhr im Nebenraum statt.',lq:['Was findet trotzdem statt?','Der Konversationskurs.','Das Fitnesstraining.','Die Reparatur.']},
{read:'Im neuen Job muss Leon oft telefonieren. Er kann technische Fragen gut beantworten, aber er möchte höflicher und sicherer auf Deutsch sprechen können.',rq:['Was möchte Leon verbessern?','Sein höfliches und sicheres Sprechen.','Seine Mathematik.','Seinen Arbeitsweg.'],listen:'Sie können den Kundendienst heute bis 17 Uhr erreichen. Nach 17 Uhr können Sie eine Nachricht hinterlassen und wir rufen morgen zurück.',lq:['Was kann man nach 17 Uhr tun?','Eine Nachricht hinterlassen.','Direkt mit dem Chef sprechen.','Im Büro warten.']},
{read:'Nächstes Jahr möchte Amina nach Münster ziehen. Zuerst will sie eine Stelle finden, danach eine Wohnung suchen. Sie plant, vorher ihr Deutsch deutlich zu verbessern.',rq:['Was will Amina zuerst machen?','Eine Stelle finden.','Eine Wohnung kaufen.','Ein Auto mieten.'],listen:'Die Informationsveranstaltung Arbeiten in Deutschland beginnt am Freitag um 16 Uhr. Eine Anmeldung ist bis Mittwoch online möglich.',lq:['Bis wann kann man sich anmelden?','Bis Mittwoch.','Bis Freitagabend.','Bis Montag.']},
{read:'Eine kleine Wohnung im Zentrum ist oft teurer als eine größere Wohnung am Stadtrand. Dafür ist der Arbeitsweg im Zentrum meist kürzer.',rq:['Welchen Vorteil hat die Wohnung im Zentrum?','Der Arbeitsweg ist meist kürzer.','Sie ist immer größer.','Sie ist immer billiger.'],listen:'Das Monatsticket kostet ab Januar 59 Euro. Das Einzelticket bleibt genauso teuer wie im letzten Jahr.',lq:['Was wird teurer?','Das Monatsticket.','Das Einzelticket.','Beide Tickets.']},
{read:'Bei einem Behördentermin versteht Paul eine Frage nicht. Er bittet höflich um Wiederholung und fragt anschließend, welche Unterlagen noch fehlen.',rq:['Was macht Paul, wenn er etwas nicht versteht?','Er bittet um Wiederholung.','Er geht sofort nach Hause.','Er antwortet auf Englisch.'],listen:'Für Ihren Termin bringen Sie bitte Ihren Pass und die Meldebescheinigung mit. Ein Foto ist nicht nötig.',lq:['Was ist nicht nötig?','Ein Foto.','Der Pass.','Die Meldebescheinigung.']},
{read:'Lena bewirbt sich auf eine Stelle als Softwareentwicklerin. In ihrer Bewerbung beschreibt sie ihre Erfahrung mit APIs, Datenbanken und Kundenprojekten und erklärt, warum sie die Stelle interessiert.',rq:['Was beschreibt Lena in ihrer Bewerbung?','Ihre relevante Erfahrung.','Nur ihre Hobbys.','Nur ihre Adresse.'],listen:'Das Vorstellungsgespräch findet am Dienstag um 10 Uhr online statt. Den Link erhalten Sie am Montag per E-Mail.',lq:['Wann bekommt man den Link?','Am Montag.','Am Dienstag nach dem Gespräch.','Am Freitag.']},
{read:'Nach zwei Wochen kann Amir längere Antworten geben. Er benutzt häufiger Konnektoren und macht weniger Fehler bei der Wortstellung. Beim schnellen Hören fehlen ihm aber noch Details.',rq:['Welche Fähigkeit bleibt schwächer?','Schnelles Hörverstehen.','Wortstellung.','Lange Antworten.'],listen:'Im Zwischentest gibt es drei Teile: Lesen, Hören und Sprechen. Für jeden Teil stehen zwanzig Minuten zur Verfügung.',lq:['Wie viele Teile hat der Zwischentest?','Drei.','Zwei.','Vier.']},
{read:'Nach seiner Ausbildung arbeitete David zuerst in einer kleinen Firma. Später wechselte er zu einem internationalen Unternehmen. Seit drei Jahren arbeitet er überwiegend remote.',rq:['Wo arbeitete David zuerst?','In einer kleinen Firma.','In einem internationalen Unternehmen.','Nur zu Hause.'],listen:'Frau Berger erzählt im Radio von ihrer Karriere. Nach dem Studium arbeitete sie fünf Jahre im Vertrieb und wechselte dann in die IT.',lq:['Wo arbeitete Frau Berger zuerst?','Im Vertrieb.','In der IT.','Im Krankenhaus.']},
{read:'Das ist das Projekt, das unser Team im letzten Jahr entwickelt hat. Die Kundin, die das System täglich benutzt, hat besonders die einfache Bedienung gelobt.',rq:['Was hat die Kundin besonders gelobt?','Die einfache Bedienung.','Den hohen Preis.','Die lange Schulung.'],listen:'Wir suchen eine Kollegin, die Erfahrung mit Kundenprojekten hat und die auch selbstständig arbeiten kann.',lq:['Welche Erfahrung wird gesucht?','Erfahrung mit Kundenprojekten.','Erfahrung als Koch.','Erfahrung im Sport.']},
{read:'Bei einem wichtigen Projekt gab es plötzlich Leistungsprobleme. Das Team analysierte zuerst die Ursache, optimierte danach die Datenbank und konnte die Antwortzeiten deutlich reduzieren.',rq:['Was optimierte das Team?','Die Datenbank.','Das Büro.','Den Vertrag.'],listen:'Nach einem Systemausfall wurde zunächst der fehlerhafte Dienst gestoppt. Danach stellte das Team die letzte stabile Version wieder her.',lq:['Was geschah nach dem Stoppen des Dienstes?','Die stabile Version wurde wiederhergestellt.','Das Büro wurde geschlossen.','Neue Hardware wurde bestellt.']},
{read:'Beim Hören auf B1-Niveau kommen oft Alltagssituationen, Ansagen, Gespräche und kurze Interviews vor. Entscheidend ist, Hauptaussagen und wichtige Einzelheiten zu erkennen.',rq:['Was muss man auf B1 besonders erkennen?','Hauptaussagen und wichtige Details.','Nur einzelne Verben.','Nur Namen.'],listen:'Im Stadtzentrum ist die Hauptstraße wegen eines Unfalls gesperrt. Die Buslinien 4 und 7 fahren deshalb über die Parkstraße. Rechnen Sie mit Verspätungen.',lq:['Warum fahren die Busse über die Parkstraße?','Wegen einer Straßensperrung.','Wegen eines Festivals.','Wegen eines Streiks.']},
{read:'Sehr geehrte Damen und Herren, ich interessiere mich für Ihre ausgeschriebene Stelle. Könnten Sie mir bitte mitteilen, ob die Position auch teilweise remote ausgeübt werden kann?',rq:['Was möchte die Person wissen?','Ob teilweise Remote-Arbeit möglich ist.','Wie teuer ein Hotel ist.','Wann der Zug fährt.'],listen:'Ihre Bewerbung ist bei uns eingegangen. Wir melden uns spätestens am kommenden Donnerstag. Bitte senden Sie bis dahin keine weiteren Unterlagen.',lq:['Bis wann will die Firma antworten?','Bis Donnerstag.','Bis morgen.','Bis Monatsende.']},
{read:'Im Gespräch mit der Vermieterin erklärt Samir, dass er langfristig in der Stadt bleiben möchte. Er fragt nach Nebenkosten, Kaution und dem möglichen Einzugstermin.',rq:['Wonach fragt Samir?','Nach Kosten und Einzugstermin.','Nach einem neuen Job.','Nach einem Sprachkurs.'],listen:'Die Wohnung kann ab dem ersten November bezogen werden. Die Kaution beträgt zwei Monatsmieten, Haustiere sind nach Absprache erlaubt.',lq:['Wie hoch ist die Kaution?','Zwei Monatsmieten.','Eine Monatsmiete.','Drei Monatsmieten.']},
{read:'Im B1-Bereich sollte man Informationen aus verschiedenen praktischen Textsorten verstehen können: Anzeigen, Mitteilungen, E-Mails, kurze Artikel und einfache Vertragsinformationen.',rq:['Welche Texte gehören typischerweise dazu?','Praktische Alltagstexte.','Nur Gedichte.','Nur wissenschaftliche Artikel.'],listen:'Beim Modelltest hören Sie jede Aufgabe zweimal. Lesen Sie vor dem Hören die Fragen und markieren Sie danach sofort Ihre Antwort.',lq:['Was soll man vor dem Hören tun?','Die Fragen lesen.','Die Lösung ansehen.','Den Text übersetzen.']},
{read:'Meiner Meinung nach bietet Homeoffice viele Vorteile, weil man Zeit spart. Andererseits fehlt manchmal der direkte Austausch mit Kolleginnen und Kollegen.',rq:['Welcher Nachteil wird genannt?','Weniger direkter Austausch.','Längere Fahrtzeit.','Höhere Parkkosten.'],listen:'Drei Personen sprechen über Homeoffice. Die erste schätzt die Ruhe, die zweite vermisst das Team, und die dritte bevorzugt eine Mischung aus Büro und Zuhause.',lq:['Was bevorzugt die dritte Person?','Eine Mischung.','Nur Büro.','Nur Zuhause.']},
{read:'Arbeiten im Ausland kann berufliche Chancen eröffnen und neue Erfahrungen bringen. Allerdings muss man sich an neue Regeln, Sprache und Kultur gewöhnen.',rq:['Welche Schwierigkeit wird genannt?','Anpassung an neue Bedingungen.','Zu viele Urlaubstage.','Keine neuen Erfahrungen.'],listen:'In unserer Radiosendung diskutieren heute zwei Gäste über internationale Karrierewege. Ein Gast betont bessere Chancen, der andere spricht über die Belastung für Familien.',lq:['Worüber sprechen die Gäste?','Über Chancen und Belastungen internationaler Arbeit.','Über Sport.','Über Kochrezepte.']},
{read:'Obwohl viele Menschen digitale Dienste praktisch finden, sorgen sie sich um Datenschutz. Während Unternehmen neue Funktionen entwickeln, erwarten Nutzer transparente Regeln.',rq:['Worüber sorgen sich viele Menschen?','Über Datenschutz.','Über das Wetter.','Über Fahrkarten.'],listen:'Die Stadt führt eine neue App für Behördentermine ein. Dadurch sollen Wartezeiten sinken. Wer kein Smartphone hat, kann Termine weiterhin telefonisch buchen.',lq:['Was bleibt weiterhin möglich?','Telefonisch buchen.','Nur persönlich buchen.','Gar keinen Termin buchen.']},
{read:'Bei technischen Projekten müssen Anforderungen klar beschrieben, Schnittstellen dokumentiert und Fehler systematisch analysiert werden. Gute Kommunikation ist dabei genauso wichtig wie Programmierkenntnisse.',rq:['Was ist neben Programmierkenntnissen wichtig?','Gute Kommunikation.','Nur schnelle Hardware.','Ein großes Büro.'],listen:'Das neue Update wird heute Abend bereitgestellt. Während der Installation kann die Anwendung ungefähr zwanzig Minuten nicht verwendet werden.',lq:['Wie lange kann die Anwendung ausfallen?','Ungefähr zwanzig Minuten.','Zwei Stunden.','Den ganzen Tag.']},
{read:'Im Vorstellungsgespräch sollte eine Antwort nicht nur eine Stärke nennen, sondern sie mit einem konkreten Beispiel belegen. Dadurch wirkt die Antwort glaubwürdiger und professioneller.',rq:['Wie wird eine Stärke glaubwürdiger?','Durch ein konkretes Beispiel.','Durch eine sehr kurze Antwort.','Durch Übersetzung ins Französische.'],listen:'Die Personalchefin fragt: Erzählen Sie von einer schwierigen Situation im Projekt und erklären Sie, wie Sie das Problem gelöst haben.',lq:['Was soll der Bewerber erklären?','Wie er ein Problem gelöst hat.','Wie er Urlaub plant.','Wie er zur Arbeit fährt.']},
{read:'Bei einer längeren Diskussion muss man nicht jedes unbekannte Wort nachschlagen. Man kann die Bedeutung oft aus dem Kontext erschließen und seine eigene Aussage mit einfacheren Wörtern umformulieren.',rq:['Was kann man bei einem unbekannten Wort tun?','Aus dem Kontext erschließen oder umformulieren.','Immer sofort abbrechen.','Nur auf Französisch antworten.'],listen:'Heute hören Sie einen kurzen Beitrag über nachhaltige Mobilität. Achten Sie besonders auf die Argumente für Bahn, Fahrrad und Carsharing sowie auf die genannten Nachteile.',lq:['Worauf soll man besonders achten?','Auf Argumente und Nachteile.','Nur auf Städtenamen.','Nur auf Zahlen.']},
{read:'Nach vier Wochen wird nicht nur der Testscore betrachtet. Entscheidend ist auch, ob längere Texte besser verstanden werden, Antworten flüssiger werden und wiederkehrende Fehler seltener auftreten.',rq:['Was zählt außer dem Testscore?','Reale Verbesserung der Fähigkeiten.','Nur die Anzahl gelernter Wörter.','Nur die Lernzeit.'],listen:'Zum Abschluss vergleichen wir Ihre Ergebnisse mit dem ersten Diagnosetest. Danach werden die nächsten Lernziele nach Ihren stärksten und schwächsten Bereichen festgelegt.',lq:['Was geschieht nach dem Vergleich?','Neue Lernziele werden festgelegt.','Der Kurs endet ohne Auswertung.','Alle Übungen werden gelöscht.']}
];
function auditMaterials(){
 if(materials.length!==topics.length) throw new Error('Hören/Lesen: nombre de supports incohérent');
 materials.forEach((m,i)=>{
   if(!m.listen||!m.lq||m.lq.length!==4) throw new Error('Hören J'+(i+1)+' incomplet');
   if(!m.read||!m.rq||m.rq.length!==4) throw new Error('Lesen J'+(i+1)+' incomplet');
   const answers=[m.lq[1],m.rq[1]];
   if(new Set(m.lq.slice(1)).size!==3) throw new Error('Hören J'+(i+1)+' réponses dupliquées');
   if(new Set(m.rq.slice(1)).size!==3) throw new Error('Lesen J'+(i+1)+' réponses dupliquées');
   if(!answers[0]||!answers[1]) throw new Error('Support J'+(i+1)+' sans réponse correcte');
 });
}

0:{r:'Heute lernst du feste Ausdrücke: Hallo, Guten Morgen, Tschüss, Ich heiße … und Wie heißt du?',e:['Hallo! Ich heiße Anna.','Guten Morgen! Wie heißt du?'],w:'Du musst heute noch keine Grammatikregel auswendig lernen.',v:[['bonjour','Hallo'],['bonjour le matin','Guten Morgen'],['bonjour poli','Guten Tag'],['au revoir','Tschüss'],['je m’appelle','Ich heiße']],m:'Sage laut: Hallo! Ich heiße … Danach frage: Wie heißt du?'},
1:{r:'Für eine Vorstellung helfen feste Muster: Ich heiße …, Ich komme aus …, Ich spreche …',e:['Ich heiße Samir.','Ich komme aus Marokko.'],w:'❌ Ich aus Marokko komme. → ✅ Ich komme aus Marokko.',v:[['s’appeler','heißen'],['venir','kommen'],['parler','sprechen'],['allemand','Deutsch'],['Maroc','Marokko']],m:'Stelle dich in 4 einfachen Sätzen vor.'},
2:{r:'sein und haben sind sehr wichtige Verben. Lerne ihre häufigsten Formen: ich bin, du bist, er/sie ist; ich habe, du hast, er/sie hat.',e:['Ich bin müde.','Ich habe Zeit.'],w:'❌ Ich bist müde. → ✅ Ich bin müde.',v:[['être','sein'],['avoir','haben'],['fatigué','müde'],['temps','Zeit'],['famille','Familie']],m:'Bilde 5 Sätze mit ich bin und ich habe.'},
3:{r:'Zahlen und Uhrzeiten brauchst du jeden Tag. Für die Uhrzeit sagst du zum Beispiel: um neun Uhr.',e:['Ich bin 40 Jahre alt.','Der Termin ist um zehn Uhr.'],w:'❌ Ich habe 40 Jahre. → ✅ Ich bin 40 Jahre alt.',v:[['un','eins'],['deux','zwei'],['dix','zehn'],['heure','Uhr'],['ans','Jahre']],m:'Sage dein Alter, drei Zahlen und zwei Uhrzeiten.'},
4:{r:'Einfache W-Fragen beginnen oft mit wer, was, wo oder wie. Danach kommt das Verb.',e:['Wie heißt du?','Wo wohnst du?'],w:'❌ Wo du wohnst? → ✅ Wo wohnst du?',v:[['qui','wer'],['quoi','was'],['où','wo'],['comment','wie'],['habiter','wohnen']],m:'Stelle 5 einfache Fragen mit wer, was, wo oder wie.'},
5:{r:'Nomen haben ein grammatisches Geschlecht. Lerne neue Wörter am besten direkt mit Artikel: der, die oder das.',e:['der Tisch','die Lampe','das Buch'],w:'Lerne nicht nur „Tisch“, sondern „der Tisch“.',v:[['le (masc.)','der'],['la (fém.)','die'],['le (neutre)','das'],['un','ein'],['une','eine']],m:'Nenne 6 Gegenstände mit ihrem Artikel.'},
6:{r:'Im A1-Checkpoint verbindest du Begrüßung, Vorstellung, sein/haben, Zahlen, Fragen und Artikel.',e:['Ich heiße Omar und komme aus Marokko.','Ich bin 40 Jahre alt und lerne Deutsch.'],w:'Sprich langsam und bilde kurze, korrekte Sätze.',v:[['nom','Name'],['pays','Land'],['langue','Sprache'],['âge','Alter'],['question','Frage']],m:'Stelle dich 1 bis 2 Minuten vor und beantworte einfache Fragen.'},
7:{r:'Dans une proposition principale, le verbe conjugué est en 2e position logique. Si tu commences par Heute, Morgen ou Am Wochenende, le verbe vient avant le sujet.',e:['Heute arbeite ich zu Hause.','Am Wochenende besuche ich meine Familie.'],w:'❌ Heute ich arbeite. → ✅ Heute arbeite ich.',v:[['aujourd’hui','heute'],['demain','morgen'],['week-end','am Wochenende'],['travailler','arbeiten'],['habiter','wohnen']],m:'Parle 2 minutes de ta journée avec Heute, Morgen et Am Wochenende.'},
8:{r:'Avec weil, dass et wenn, le verbe conjugué va à la fin de la subordonnée.',e:['Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.','Ich glaube, dass Deutsch wichtig ist.'],w:'❌ weil ich habe Zeit → ✅ weil ich Zeit habe',v:[['parce que','weil'],['que','dass'],['si/quand','wenn'],['apprendre','lernen'],['vouloir','möchten']],m:'Réponds : Warum möchten Sie in Deutschland arbeiten? Utilise weil 3 fois.'},
9:{r:'À l’accusatif masculin : der → den et ein → einen. Il marque souvent l’objet direct.',e:['Ich suche einen Job.','Ich brauche einen Termin.'],w:'❌ Ich suche ein Job. → ✅ Ich suche einen Job.',v:[['emploi','Job'],['rendez-vous','Termin'],['chercher','suchen'],['avoir besoin','brauchen'],['visiter','besuchen']],m:'Fais 5 phrases avec suchen, brauchen, haben ou besuchen.'},
10:{r:'Après mit, bei, von, zu et aus, on utilise le datif.',e:['Ich fahre mit dem Bus.','Ich wohne bei meinem Bruder.'],w:'❌ mit den Bus → ✅ mit dem Bus',v:[['avec','mit'],['chez','bei'],['de','von'],['vers/chez','zu'],['de/origine','aus']],m:'Explique comment tu te déplaces et avec qui tu habites/parles.'},
11:{r:'Perfekt = haben/sein conjugué + participe passé à la fin. Les déplacements utilisent souvent sein.',e:['Ich habe gestern gearbeitet.','Ich bin nach Berlin gefahren.'],w:'❌ Ich habe nach Berlin gefahren. → ✅ Ich bin nach Berlin gefahren.',v:[['fait','gemacht'],['travaillé','gearbeitet'],['appris','gelernt'],['vu','gesehen'],['trouvé','gefunden']],m:'Raconte hier pendant 3 minutes au Perfekt.'},
14:{r:'aber garde l’ordre normal. deshalb et trotzdem prennent la première position : le verbe vient ensuite.',e:['Ich bin müde, aber ich lerne.','Es regnet. Trotzdem gehe ich raus.'],w:'❌ Deshalb ich lerne. → ✅ Deshalb lerne ich.',v:[['mais','aber'],['donc','deshalb'],['pourtant','trotzdem'],['en plus','außerdem'],['ensuite','danach']],m:'Parle 3 minutes avec aber, deshalb, außerdem et danach.'},

7:{intro:"En allemand, le verbe conjugué agit comme un repère fixe dans la phrase principale : il occupe normalement la deuxième position logique.",steps:["Sujet en première position : Ich arbeite heute.","Complément en première position : Heute arbeite ich.","Le sujet passe alors après le verbe : Am Wochenende besuche ich meine Familie."],tip:"Ne compte pas les mots, compte les blocs. « Am Wochenende » occupe une seule position."},
8:{intro:"weil, dass et wenn introduisent une proposition subordonnée. Dans cette partie de la phrase, le verbe conjugué se place à la fin.",steps:["Principale : Ich lerne Deutsch.","Subordonnée : weil ich in Deutschland arbeiten möchte.","Avec un modal, le modal conjugué reste tout à la fin : arbeiten möchte."],tip:"Quand tu prononces weil/dass/wenn, pense immédiatement : « le verbe attend à la fin »."},
9:{intro:"L’accusatif sert surtout à marquer l’objet direct : la personne ou la chose directement concernée par l’action.",steps:["Ich suche einen Job. → Was suche ich? Einen Job.","Au masculin : der → den ; ein → einen.","Féminin et neutre changent beaucoup moins dans les formes de base."],tip:"Apprends les verbes fréquents avec leur modèle : suchen + Akkusativ, brauchen + Akkusativ, besuchen + Akkusativ."},
10:{intro:"Le datif apparaît souvent après certaines prépositions très fréquentes comme mit, bei, von, zu et aus.",steps:["mit dem Bus","bei meinem Bruder","mit meiner Schwester"],tip:"Pour progresser vite, mémorise des groupes complets plutôt qu’une règle abstraite : mit dem, bei meinem, mit meiner."},
11:{intro:"Le Perfekt est le temps le plus utilisé à l’oral pour raconter ce qui s’est passé.",steps:["haben/sein est conjugué en deuxième position.","Le participe passé va généralement à la fin.","Les déplacements et changements d’état utilisent souvent sein : Ich bin gefahren."],tip:"Structure mentale : sujet + auxiliaire + informations + participe passé."},
14:{intro:"Les connecteurs permettent de passer de petites phrases isolées à un discours B1 plus naturel.",steps:["aber : ordre normal après la conjonction.","deshalb / trotzdem / außerdem : ils occupent la position 1, donc le verbe vient immédiatement après.","Exemple : Deshalb lerne ich jeden Tag."],tip:"Varie tes connecteurs au lieu d’utiliser toujours und."},
15:{intro:"Les verbes modaux expriment capacité, obligation, volonté, conseil ou permission.",steps:["Le modal est conjugué : ich kann, ich muss, ich will.","Le deuxième verbe reste à l’infinitif à la fin.","Exemple : Ich muss heute länger arbeiten."],tip:"Pense à une parenthèse verbale : modal au début de la structure, infinitif à la fin."},
22:{intro:"Une proposition relative ajoute une information sur un nom sans commencer une nouvelle phrase.",steps:["Das ist die Firma, die in Berlin arbeitet.","Le pronom relatif dépend du nom décrit.","Le verbe de la relative va à la fin."],tip:"Identifie d’abord le nom décrit, puis choisis der/die/das et pousse le verbe à la fin."},
28:{intro:"Au niveau B1/B2, donner une opinion ne suffit plus : il faut l’expliquer, l’illustrer et éventuellement la nuancer.",steps:["Position : Meiner Meinung nach...","Justification : weil / denn...","Exemple concret.","Nuance : Einerseits..., andererseits...","Conclusion : Insgesamt denke ich, dass..."],tip:"Une bonne réponse orale B2 ressemble à une mini-argumentation, pas à une seule phrase."},
30:{intro:"obwohl et während sont des subordonnants : le verbe va à la fin. deshalb est un adverbe connecteur : le verbe vient juste après.",steps:["Obwohl ich müde bin, lerne ich.","Während ich arbeite, höre ich Deutsch.","Ich habe wenig Zeit. Deshalb lerne ich morgens."],tip:"Distingue toujours subordonnant (verbe final) et connecteur de phrase principale (verbe en position 2)."}
};

2:{intro:'Der Akkusativ markiert sehr oft das direkte Objekt einer Handlung.',rule:'Beim maskulinen Akkusativ gilt: der → den und ein → einen.',steps:['Ich suche einen Job. Frage: Was suche ich? Einen Job.','Maskulin: der → den; ein → einen.','Feminin und Neutrum verändern sich in diesen Grundformen nicht so stark.'],tip:'Lerne häufige Verben direkt mit ihrem Muster: suchen + Akkusativ, brauchen + Akkusativ, besuchen + Akkusativ.',error:'Falsch: Ich suche ein Job. Richtig: Ich suche einen Job.'},
3:{intro:'Der Dativ steht häufig nach bestimmten Präpositionen wie mit, bei, von, zu und aus.',rule:'Nach mit, bei, von, zu und aus verwendet man den Dativ.',steps:['mit dem Bus','bei meinem Bruder','mit meiner Schwester'],tip:'Lerne feste Wortgruppen: mit dem, bei meinem, mit meiner.',error:'Falsch: mit den Bus. Richtig: mit dem Bus.'},
4:{intro:'Das Perfekt ist die wichtigste Vergangenheitsform in der gesprochenen Alltagssprache.',rule:'Perfekt = haben oder sein + Partizip II. Das Partizip steht normalerweise am Satzende.',steps:['Das Hilfsverb haben oder sein wird konjugiert.','Das Partizip II steht meist am Ende.','Bei Bewegung und Zustandsänderung benutzt man oft sein: Ich bin gefahren.'],tip:'Merke dir das Muster: Subjekt + Hilfsverb + Informationen + Partizip II.',error:'Falsch: Ich habe nach Berlin gefahren. Richtig: Ich bin nach Berlin gefahren.'},
7:{intro:'Konnektoren verbinden Gedanken und machen deine Aussagen natürlicher und strukturierter.',rule:'aber behält die normale Wortstellung. Nach deshalb, trotzdem und außerdem steht das Verb direkt danach.',steps:['Ich bin müde, aber ich lerne.','Es regnet. Trotzdem gehe ich raus.','Ich möchte in Deutschland arbeiten. Deshalb lerne ich Deutsch.'],tip:'Benutze verschiedene Konnektoren statt immer nur und.',error:'Falsch: Deshalb ich lerne. Richtig: Deshalb lerne ich.'},
8:{intro:'Modalverben drücken Fähigkeit, Pflicht, Wunsch, Empfehlung oder Erlaubnis aus.',rule:'Das Modalverb wird konjugiert. Das zweite Verb steht als Infinitiv am Satzende.',steps:['Ich kann Deutsch sprechen.','Ich muss heute arbeiten.','Wir wollen morgen fahren.'],tip:'Denke an eine Verbklammer: Modalverb vorne, Infinitiv am Ende.',error:'Falsch: Ich kann spreche Deutsch. Richtig: Ich kann Deutsch sprechen.'},
15:{intro:'Ein Relativsatz gibt zusätzliche Informationen über ein Nomen, ohne einen neuen Hauptsatz zu beginnen.',rule:'Relativsätze beginnen oft mit der, die oder das. Das konjugierte Verb steht am Ende.',steps:['Das ist die Firma, die in Berlin arbeitet.','Das ist das Projekt, das ich entwickelt habe.','Bestimme zuerst das Nomen, auf das sich der Relativsatz bezieht.'],tip:'Finde zuerst das Bezugswort, wähle dann das Relativpronomen und setze das Verb ans Ende.',error:'Im Relativsatz steht das konjugierte Verb am Ende.'},
21:{intro:'Auf B1/B2 reicht eine einfache Meinung nicht mehr. Du solltest sie begründen, mit einem Beispiel erklären und wenn möglich differenzieren.',rule:'Eine gute Meinungsäußerung folgt oft diesem Muster: Position → Begründung → Beispiel → Gegenargument oder Nuance → Schluss.',steps:['Position: Meiner Meinung nach ...','Begründung: weil / denn ...','Beispiel nennen.','Nuance: Einerseits ..., andererseits ...','Schluss: Insgesamt denke ich, dass ...'],tip:'Eine gute B2-Antwort ist eine kleine Argumentation und nicht nur ein einzelner Satz.',error:'Vermeide nur „gut“ oder „schlecht“. Erkläre immer warum.'},
23:{intro:'obwohl und während leiten Nebensätze ein. deshalb verbindet Hauptsätze und verändert die Wortstellung.',rule:'Nach obwohl und während steht das Verb am Ende. Nach deshalb steht das Verb auf Position 2 direkt nach deshalb.',steps:['Obwohl ich müde bin, lerne ich.','Während ich arbeite, höre ich Deutsch.','Ich habe wenig Zeit. Deshalb lerne ich morgens.'],tip:'Unterscheide: Nebensatzkonnektor = Verb am Ende; Hauptsatzkonnektor = Verb auf Position 2.',error:'Falsch: Obwohl ich bin müde. Richtig: Obwohl ich müde bin.'}
};
const courseHelpTranslations={
7:{en:{intro:'In a German main clause, the conjugated verb normally occupies the second logical position.',rule:'The conjugated verb is in position 2. If the sentence starts with a time or place expression, the verb comes before the subject.',steps:'Subject first: Ich arbeite heute. • Time first: Heute arbeite ich. • The subject then comes after the verb: Am Wochenende besuche ich meine Familie.',tip:'Count sentence blocks, not individual words. “Am Wochenende” is one block.',error:'Wrong: Heute ich arbeite. Correct: Heute arbeite ich.'},ar:{intro:'في الجملة الرئيسية الألمانية يأتي الفعل المصرف عادة في الموقع المنطقي الثاني.',rule:'يأتي الفعل المصرف في الموقع الثاني. إذا بدأت الجملة بظرف زمان أو مكان، يأتي الفعل قبل الفاعل.',steps:'الفاعل أولاً: Ich arbeite heute. • الزمان أولاً: Heute arbeite ich. • بعد ذلك يأتي الفاعل بعد الفعل: Am Wochenende besuche ich meine Familie.',tip:'احسب مجموعات الجملة وليس الكلمات المفردة. «Am Wochenende» تُعد مجموعة واحدة.',error:'خطأ: Heute ich arbeite. صحيح: Heute arbeite ich.'}},
8:{en:{intro:'weil, dass and wenn introduce subordinate clauses. In a subordinate clause, the conjugated verb goes to the end.',rule:'After weil, dass and wenn, place the conjugated verb at the end of the subordinate clause.',steps:'Main clause: Ich lerne Deutsch. • Subordinate clause: weil ich in Deutschland arbeiten möchte. • With a modal verb, the conjugated modal is at the very end.',tip:'When you see weil, dass or wenn, think immediately: the verb waits at the end.',error:'Wrong: weil ich habe Zeit. Correct: weil ich Zeit habe.'},ar:{intro:'تُدخل weil و dass و wenn جملة فرعية، وفي الجملة الفرعية يأتي الفعل المصرف في النهاية.',rule:'بعد weil و dass و wenn يأتي الفعل المصرف في نهاية الجملة الفرعية.',steps:'جملة رئيسية: Ich lerne Deutsch. • جملة فرعية: weil ich in Deutschland arbeiten möchte. • مع الفعل الناقص يأتي الفعل المصرف في النهاية تماماً.',tip:'عندما ترى weil أو dass أو wenn تذكّر فوراً: الفعل ينتظر في النهاية.',error:'خطأ: weil ich habe Zeit. صحيح: weil ich Zeit habe.'}},
9:{en:{intro:'The accusative often marks the direct object of an action.',rule:'For masculine nouns in the accusative: der → den and ein → einen.',steps:'Ich suche einen Job. • Ask: Was suche ich? Einen Job. • Feminine and neuter forms change less in these basic patterns.',tip:'Learn frequent verbs together with their pattern: suchen + Akkusativ, brauchen + Akkusativ, besuchen + Akkusativ.',error:'Wrong: Ich suche ein Job. Correct: Ich suche einen Job.'},ar:{intro:'غالباً ما يحدد المفعول به المباشر في الألمانية حالة الـ Akkusativ.',rule:'في المذكر: der تصبح den و ein تصبح einen في حالة Akkusativ.',steps:'Ich suche einen Job. • نسأل: Was suche ich? Einen Job. • المؤنث والمحايد يتغيران بدرجة أقل في هذه الصيغ الأساسية.',tip:'احفظ الأفعال الشائعة مع حالتها: suchen + Akkusativ، brauchen + Akkusativ، besuchen + Akkusativ.',error:'خطأ: Ich suche ein Job. صحيح: Ich suche einen Job.'}},
10:{en:{intro:'The dative is frequently used after certain prepositions such as mit, bei, von, zu and aus.',rule:'Use the dative after mit, bei, von, zu and aus.',steps:'mit dem Bus • bei meinem Bruder • mit meiner Schwester',tip:'Memorize complete chunks such as mit dem, bei meinem and mit meiner.',error:'Wrong: mit den Bus. Correct: mit dem Bus.'},ar:{intro:'تأتي حالة Dativ كثيراً بعد حروف جر مثل mit و bei و von و zu و aus.',rule:'استخدم Dativ بعد mit و bei و von و zu و aus.',steps:'mit dem Bus • bei meinem Bruder • mit meiner Schwester',tip:'احفظ تراكيب كاملة مثل mit dem و bei meinem و mit meiner.',error:'خطأ: mit den Bus. صحيح: mit dem Bus.'}},
11:{en:{intro:'The Perfekt is the most common past tense in everyday spoken German.',rule:'Perfekt = haben or sein + past participle. The participle usually goes at the end of the sentence.',steps:'Conjugate haben or sein. • Put the participle at the end. • Movement and changes of state often use sein.',tip:'Mental pattern: subject + auxiliary + information + past participle.',error:'Wrong: Ich habe nach Berlin gefahren. Correct: Ich bin nach Berlin gefahren.'},ar:{intro:'يُعد Perfekt أكثر أزمنة الماضي استعمالاً في الألمانية المحكية اليومية.',rule:'Perfekt = haben أو sein + اسم المفعول، وغالباً يأتي اسم المفعول في نهاية الجملة.',steps:'صرّف haben أو sein. • ضع اسم المفعول في النهاية. • أفعال الحركة وتغير الحالة تستعمل sein غالباً.',tip:'النمط الذهني: الفاعل + الفعل المساعد + المعلومات + اسم المفعول.',error:'خطأ: Ich habe nach Berlin gefahren. صحيح: Ich bin nach Berlin gefahren.'}},
14:{en:{intro:'Connectors link ideas and make your speech more natural and structured.',rule:'aber keeps normal word order. After deshalb, trotzdem and außerdem, the verb comes immediately after the connector.',steps:'Ich bin müde, aber ich lerne. • Trotzdem gehe ich raus. • Deshalb lerne ich Deutsch.',tip:'Use different connectors instead of always using und.',error:'Wrong: Deshalb ich lerne. Correct: Deshalb lerne ich.'},ar:{intro:'تربط أدوات الربط الأفكار وتجعل كلامك أكثر طبيعية وتنظيماً.',rule:'بعد aber يبقى ترتيب الكلمات عادياً. بعد deshalb و trotzdem و außerdem يأتي الفعل مباشرة.',steps:'Ich bin müde, aber ich lerne. • Trotzdem gehe ich raus. • Deshalb lerne ich Deutsch.',tip:'نوّع أدوات الربط ولا تستخدم und دائماً.',error:'خطأ: Deshalb ich lerne. صحيح: Deshalb lerne ich.'}},
15:{en:{intro:'Modal verbs express ability, obligation, intention, advice or permission.',rule:'The modal verb is conjugated and the main verb stays in the infinitive at the end.',steps:'Ich kann Deutsch sprechen. • Ich muss heute arbeiten. • Wir wollen morgen fahren.',tip:'Think of a verb bracket: modal near the front, infinitive at the end.',error:'Wrong: Ich kann spreche Deutsch. Correct: Ich kann Deutsch sprechen.'},ar:{intro:'تعبّر الأفعال الناقصة عن القدرة أو الواجب أو الرغبة أو النصيحة أو السماح.',rule:'يُصرّف الفعل الناقص، بينما يبقى الفعل الرئيسي في المصدر في نهاية الجملة.',steps:'Ich kann Deutsch sprechen. • Ich muss heute arbeiten. • Wir wollen morgen fahren.',tip:'فكّر في قوس فعلي: الفعل الناقص في المقدمة والمصدر في النهاية.',error:'خطأ: Ich kann spreche Deutsch. صحيح: Ich kann Deutsch sprechen.'}},
22:{en:{intro:'A relative clause adds information about a noun without starting a new main sentence.',rule:'Relative clauses often start with der, die or das, and the conjugated verb goes to the end.',steps:'Das ist die Firma, die in Berlin arbeitet. • Das ist das Projekt, das ich entwickelt habe.',tip:'First identify the noun, then choose the relative pronoun and move the verb to the end.',error:'In a relative clause, the conjugated verb goes to the end.'},ar:{intro:'تضيف الجملة الموصولة معلومات عن اسم دون بدء جملة رئيسية جديدة.',rule:'تبدأ الجمل الموصولة غالباً بـ der أو die أو das ويأتي الفعل المصرف في النهاية.',steps:'Das ist die Firma, die in Berlin arbeitet. • Das ist das Projekt, das ich entwickelt habe.',tip:'حدد الاسم أولاً، ثم اختر ضمير الوصل وضع الفعل في النهاية.',error:'في الجملة الموصولة يأتي الفعل المصرف في النهاية.'}},
28:{en:{intro:'At B1/B2, giving an opinion is not enough: you should explain it, give an example and add nuance.',rule:'A strong opinion answer often follows: position → reason → example → nuance → conclusion.',steps:'Position: Meiner Meinung nach ... • Reason: weil / denn ... • Give an example • Nuance: Einerseits ..., andererseits ... • Conclusion.',tip:'A good B2 answer is a short argument, not a single sentence.',error:'Avoid only saying gut or schlecht. Explain why.'},ar:{intro:'في B1/B2 لا يكفي ذكر الرأي فقط؛ يجب شرحه وتقديم مثال وإضافة قدر من التوازن.',rule:'إجابة الرأي الجيدة تتبع غالباً: موقف ← سبب ← مثال ← توازن أو رأي مقابل ← خلاصة.',steps:'الموقف: Meiner Meinung nach ... • السبب: weil / denn ... • مثال • التوازن: Einerseits ..., andererseits ... • الخلاصة.',tip:'إجابة B2 الجيدة حجة قصيرة وليست جملة واحدة.',error:'تجنب الاكتفاء بـ gut أو schlecht واشرح السبب.'}},
30:{en:{intro:'obwohl and während introduce subordinate clauses; deshalb links main clauses and changes the word order.',rule:'After obwohl and während, the verb goes to the end. After deshalb, the verb is in position 2 directly after deshalb.',steps:'Obwohl ich müde bin, lerne ich. • Während ich arbeite, höre ich Deutsch. • Deshalb lerne ich morgens.',tip:'Distinguish: subordinate-clause connector = verb at the end; main-clause connector = verb in position 2.',error:'Wrong: Obwohl ich bin müde. Correct: Obwohl ich müde bin.'},ar:{intro:'تُدخل obwohl و während جملة فرعية، بينما تربط deshalb الجمل الرئيسية وتغيّر ترتيب الكلمات.',rule:'بعد obwohl و während يأتي الفعل في النهاية. بعد deshalb يأتي الفعل في الموقع الثاني مباشرة.',steps:'Obwohl ich müde bin, lerne ich. • Während ich arbeite, höre ich Deutsch. • Deshalb lerne ich morgens.',tip:'ميّز بين أداة الجملة الفرعية: الفعل في النهاية، وأداة الجملة الرئيسية: الفعل في الموقع الثاني.',error:'خطأ: Obwohl ich bin müde. صحيح: Obwohl ich müde bin.'}}
};

if(!st)st={done:{},scores:{},cur:0,steps:{},speech:{}};st.steps=st.steps||{};st.speech=st.speech||{};function save(){localStorage.setItem(key,JSON.stringify(st))}function step(i){let s=st.steps[i]||(st.steps[i]={});if(s.course==null)s.course=false;if(s.read==null)s.read=false;if(s.listen==null)s.listen=false;if(s.speak==null)s.speak=false;return s}function startIndex(){return Number(localStorage.getItem('deutschStartIndex')||0)}function openDay(i){const s=startIndex();if(i<s)return false;if(i===s)return true;return !!st.done[i-1]}function doneN(){return Object.values(st.done).filter(Boolean).length}
function side(){days.innerHTML='';topics.forEach((x,i)=>{let b=document.createElement('button');b.className='day'+(st.done[i]?' done':'')+(st.cur===i?' active':'');b.disabled=!openDay(i);b.innerHTML=`<span><b>T${i+1}</b> · ${x[0]} ${directHelpButton(topicHelp(i,0))}</span><span>${st.done[i]?'✓':openDay(i)?'→':'🔒'}</span>`;b.onclick=()=>{st.cur=i;save();render()};days.appendChild(b)});let n=doneN();pt.textContent=n+'/35';pb.style.width=(n/35*100)+'%';ps.textContent=n?`${n} ${ht('done')}`:ht('start')}

function quiz(i,d){
  const title=topics[i][0], objective=topics[i][1], v=d.v;
  const other=(idx,shift=1)=>v[(idx+shift)%v.length][1];
  let base=[
    [`Welche Regel passt am besten zur Lektion „${title}“?`,d.r,'Das konjugierte Verb kann immer irgendwo stehen.','Man muss nur Wort für Wort übersetzen.'],
    [`Welcher Satz aus der Lektion „${title}“ ist korrekt?`,d.e[0],'Ich heute Deutsch lernen.','Heute ich Deutsch lernen.'],
    [`Welchen Fehler solltest du in dieser Lektion besonders vermeiden?`,d.w,'Die Struktur völlig ignorieren.','Das Verb immer weglassen.'],
    [`Tag ${i+1}: Welches deutsche Wort bedeutet „${vocabHelp(v[0][1],v[0][0])}“?`,v[0][1],other(0,1),other(0,2)],
    [`Tag ${i+1}: Wähle das deutsche Wort für „${vocabHelp(v[1][1],v[1][0])}“.`,v[1][1],other(1,1),other(1,2)],
    [`Tag ${i+1}: Welches Wort passt zu „${vocabHelp(v[2][1],v[2][0])}“?`,v[2][1],other(2,1),other(2,2)],
    [`Tag ${i+1}: Finde die deutsche Entsprechung für „${vocabHelp(v[3][1],v[3][0])}“.`,v[3][1],other(3,1),other(3,2)],
    [`Tag ${i+1}: Welche deutsche Antwort passt zu „${vocabHelp(v[4][1],v[4][0])}“?`,v[4][1],other(4,1),other(4,2)],
    [`Was ist das praktische Ziel der Lektion „${title}“?`,objective,'Nur eine Liste ohne Kontext lernen.','Keine eigenen Sätze bilden.'],
    [`Was muss vor dem Abschlusstest von Tag ${i+1} erledigt sein?`,'Lektion + Lesen + Hören + Sprechen','Nur der Abschlusstest.','Nur der Wortschatz.']
  ];
  const seen=new Set();
  const unique=[];
  for(const q of base){
    const key=q[0].toLowerCase().replace(/\\s+/g,' ').trim();
    if(!seen.has(key)){seen.add(key);unique.push(q)}
  }
  if(unique.length!==10) throw new Error(`Quiz J${i+1}: ${unique.length}/10 questions uniques`);
  return unique.map(q=>{
    const correct=q[1],opts=q.slice(1);
    for(let n=opts.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[opts[n],opts[j]]=[opts[j],opts[n]]}
    return{q:q[0],opts,ans:opts.indexOf(correct)}
  })
}

function auditA1HelperTranslations(){
 const missing=[];
 const langs=['fr','en','ar'];
 a1Curriculum.forEach((L,i)=>{
  const texts=[L.goal,L.rule,L.task,L.read,...L.dialogue];
  texts.forEach(t=>langs.forEach(lang=>{if(!a1TextTranslations[lang]?.[t]) missing.push(`A1 J${i+1} ${lang}: ${t}`)}));
  [L.readQ[0],L.listenQ[0],...L.quiz.map(q=>q[0])].forEach(t=>langs.forEach(lang=>{if(!a1QuizTranslations[lang]?.[t]) missing.push(`A1 J${i+1} question ${lang}: ${t}`)}));
 });
 if(missing.length){console.error('A1 helper translation audit failed',missing);throw new Error('A1 helper translations missing: '+missing.length)}
 return true;
}
function a1Help(row){
 const l=helperLang();
 return l==='fr'?row[1]:l==='en'?row[2]:row[3];
}
function a1PhraseCard(row){
 return `<div class="phraseCard"><div class="phraseBig">${row[0]} ${directHelpButton(a1Help(row))}</div><div class="phraseActions"><button type="button" class="btn secondary speakText" data-text="${row[0].replace(/"/g,'&quot;')}">🔊 Hören</button></div></div>`;
}

<div class="section"><h3>🎧 Hören</h3><div class="box"><p>Höre zuerst ohne Transkript. Ab B1 sollst du das Thema <b>und ein wichtiges Detail</b> erkennen – wie bei Ansagen und Dialogen in Prüfungen. ${sentenceHelpButton('Höre zuerst ohne Transkript. Ab B1 sollst du das Thema und ein wichtiges Detail erkennen – wie bei Ansagen und Dialogen in Prüfungen.')}</p><div class="actions"><button class="btn primary" id="play">▶ Anhören</button><button class="btn secondary" id="slow">🐢 Langsam</button><button class="btn secondary" id="show">Transkript nach der Antwort anzeigen</button></div><div class="q"><b>${mat.lq[0]} <button type="button" class="iconBtn qhelp" data-help="${qHelp(mat.lq[0]).replace(/"/g,'&quot;')}">${helperLabels[helperLang()]}</button></b><div class="helpText"></div>${mat.lq.slice(1).map((o,j)=>`<label class="opt"><input type="radio" name="listenq" value="${j}"> ${o}</label>`).join('')}</div><div class="actions"><button class="btn primary" id="listenDone" disabled>Hören prüfen</button></div><div id="listenFb" class="small"></div><div class="transcript hidden" id="tr">${aud} ${sentenceHelpButton(aud,'')}</div></div></div>
<div class="section"><h3>🎙 Sprechen</h3><div class="box"><div class="mission"><b>Aufgabe:</b> ${d.m} ${sentenceHelpButton(d.m,'')}</div><p class="small">Antworte spontan. Chrome/Edge können deine deutsche Antwort über das Mikrofon transkribieren. ${sentenceHelpButton('Antworte spontan. Chrome/Edge können deine deutsche Antwort über das Mikrofon transkribieren.')}</p><div class="actions"><button class="btn primary" id="mic">🎙 Sprechen</button><button class="btn secondary" id="stop">■ Stoppen</button></div><div class="transcript" id="spoken">${speech||'Deine Transkription erscheint hier …'}</div><div class="small" id="fb"></div><div class="actions"><button class="btn primary" id="speakDone" ${speech.split(/\s+/).filter(Boolean).length>=8?'':'disabled'}>Versuch bestätigen</button><button class="btn secondary" id="manual">Mikrofon nicht verfügbar</button></div></div></div>
<div class="gate" id="gate">🔒 Der Test wird erst nach <b>Lektion + Lesen + Hören + Sprechen</b> freigeschaltet.</div><div class="section hidden" id="test"><h3>📝 Abschlusstest</h3><p class="small">10 Fragen · mindestens 9/10.</p><form id="form">${qs.map((q,n)=>`<div class="q"><b>${n+1}. ${q.q}</b>${q.opts.map((o,j)=>`<label class="opt"><input type="radio" name="q${n}" value="${j}"> ${o}</label>`).join('')}</div>`).join('')}<button class="btn primary">Auswerten und abschließen</button></form><div id="res"></div></div>`;
document.querySelectorAll('.speakText').forEach(b=>b.onclick=()=>say(b.dataset.text,.82));
document.querySelectorAll('.qhelp').forEach(b=>b.onclick=()=>{const h=b.closest('.q').querySelector('.helpText');h.textContent=b.dataset.help;h.dir=helperLang()==='ar'?'rtl':'ltr';h.classList.toggle('show')});
document.querySelectorAll('.sentenceHelp').forEach(b=>b.onclick=()=>{let h=b.nextElementSibling;if(!h||!h.classList?.contains('helpText')){h=document.createElement('div');h.className='helpText';b.parentElement.insertBefore(h,b.nextSibling)}h.textContent=b.dataset.help;h.dir=helperLang()==='ar'?'rtl':'ltr';h.classList.toggle('show')});
document.querySelectorAll('.courseHelp').forEach(b=>b.onclick=()=>{let h=b.parentElement.nextElementSibling;if(!h||!h.classList.contains('helpText')){h=b.closest('.courseDetail,.box')?.querySelector('.helpText')}if(h){h.textContent=courseHelpText(b.dataset.kind||'rule',b.dataset.help);h.dir=helperLang()==='ar'?'rtl':'ltr';h.classList.toggle('show')}});
document.querySelectorAll('#levelPick button').forEach(b=>{b.classList.toggle('active',Number(b.dataset.start)===startIndex());b.onclick=()=>{const idx=Number(b.dataset.start);localStorage.setItem('deutschStartIndex',idx);st.cur=idx;save();render()}});
document.querySelectorAll('#helperPick button').forEach(b=>{b.classList.toggle('active',b.dataset.lang===helperLang());b.onclick=()=>{localStorage.setItem('deutschHelperLang',b.dataset.lang);render()}});
courseDone.onclick=()=>{let n=practice.value.trim().split(/[.!?]+/).filter(Boolean).length;if(n<3){alert(ht('threeSentences'));return}s.course=true;save();upd(i)};
readDone.onclick=()=>{let x=document.querySelector('input[name=readq]:checked');if(!x)return readFb.textContent=ht('choose');if(+x.value===0){s.read=true;readFb.textContent=ht('correctRead');save();upd(i)}else readFb.textContent=ht('wrongRead')};
let listened=false;play.onclick=()=>{listened=true;say(aud,lvl==='B2'?1:.9);listenDone.disabled=false};slow.onclick=()=>{listened=true;say(aud,.72);listenDone.disabled=false};show.onclick=()=>tr.classList.toggle('hidden');listenDone.onclick=()=>{if(!listened&&!s.listen)return;let x=document.querySelector('input[name=listenq]:checked');if(!x)return listenFb.textContent=ht('chooseListen');if(+x.value===0){s.listen=true;listenFb.textContent=ht('correctListen');save();upd(i)}else listenFb.textContent=ht('wrongListen')};
let rec=null,final=speech;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;mic.onclick=()=>{if(!SR){alert(ht('micBrowser'));return}rec=new SR();rec.lang='de-DE';rec.continuous=true;rec.interimResults=true;rec.onresult=e=>{let inter='';for(let k=e.resultIndex;k<e.results.length;k++){let x=e.results[k][0].transcript;if(e.results[k].isFinal)final+=(final?' ':'')+x;else inter+=x}let txt=(final+' '+inter).trim();spoken.textContent=txt;let n=txt.split(/\s+/).filter(Boolean).length;fb.textContent=n+' Wörter erkannt · mindestens 8';speakDone.disabled=n<8};rec.onerror=e=>fb.textContent='Micro : '+e.error;rec.start()};stop.onclick=()=>{if(rec)rec.stop();st.speech[i]=final.trim();save()};speakDone.onclick=()=>{let txt=spoken.textContent.trim(),n=txt.split(/\s+/).filter(Boolean).length;if(n<8)return alert(ht('tooShort'));st.speech[i]=txt;s.speak=true;save();fb.textContent=ht('speechSaved');upd(i)};manual.onclick=()=>{if(confirm(ht('manualConfirm'))){s.speak=true;save();upd(i)}};
form.onsubmit=e=>{e.preventDefault();if(!(s.course&&s.read&&s.listen&&s.speak))return;let ok=0;qs.forEach((q,n)=>{let x=document.querySelector(`input[name=q${n}]:checked`);if(x&&+x.value===q.ans)ok++});let score=Math.round(ok/qs.length*100);st.scores[i]=Math.max(st.scores[i]||0,score);if(score>=90){st.done[i]=true;res.className='result good';res.innerHTML=`<b>${ht('passed')} : ${score}% 🎉</b><br>${ht('next')}`;save();side();upd(i)}else{res.className='result bad';res.innerHTML=`<b>${score}% — ${ht('failed')}.</b><br>${ht('need90')}`;save()}};upd(i)}
reset.onclick=()=>{if(confirm(ht('reset'))){localStorage.removeItem(key);st={done:{},scores:{},cur:0,steps:{},speech:{}};render()}};render();
</script></body></html>
