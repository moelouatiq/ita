const stateKey='deutschSprintV1';
let state=JSON.parse(localStorage.getItem(stateKey)||'{"done":{},"scores":{},"current":0}');
function save(){localStorage.setItem(stateKey,JSON.stringify(state))}
function unlocked(i){if(i===0)return true;return !!state.done[i-1]}
function totalDone(){return Object.keys(state.done).filter(k=>state.done[k]).length}
function renderDays(){const box=document.getElementById('days');box.innerHTML='';D.forEach((d,i)=>{const b=document.createElement('button');b.className='dayBtn'+(state.done[i]?' done':'')+(i===state.current?' active':'')+(!unlocked(i)?' locked':'');b.disabled=!unlocked(i);b.innerHTML=`<span><b>J${i+1}</b> · ${d[0]}</span><span>${state.done[i]?'✓':(!unlocked(i)?'🔒':'→')}</span>`;b.onclick=()=>{state.current=i;save();render()};box.appendChild(b)});const n=totalDone();document.getElementById('progressTxt').textContent=`${n}/28`;document.getElementById('progressBar').style.width=`${n/28*100}%`;document.getElementById('streakTxt').textContent=n?`Dernier score : ${state.scores[n-1]??'-'}%`:'Commence par le Jour 1.'}
function quizQuestions(day){const vocab=day[2].slice(0,5).map((x,idx)=>{const [fr,de]=x.split(' = ');const distract=D[(state.current+idx+1)%D.length][2].map(y=>y.split(' = ')[1]).filter(Boolean).filter(v=>v!==de).slice(0,2);return [`Que signifie « ${fr} » en allemand ?`,de,...distract,0]});return [...day[4],...vocab].slice(0,10)}
function shuffleQ(q){const prompt=q[0], opts=q.slice(1,4), correct=q[1];for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}return {prompt,opts,ans:opts.indexOf(correct)}}
let liveQuiz=[];
function render(){renderDays();const i=state.current,day=D[i],main=document.getElementById('main');if(!unlocked(i)){main.innerHTML='<div class="lockedMsg"><h2>🔒 Journée verrouillée</h2><p>Valide la journée précédente avec au moins 90 %.</p></div>';return}liveQuiz=quizQuestions(day).map(shuffleQ);main.innerHTML=`
<div class="hero"><div class="kicker">Semaine ${Math.floor(i/7)+1} · Jour ${i+1}</div><h2>${day[0]}</h2><div class="meta"><span class="pill">⏱ 2 h 15 à 2 h 45</span><span class="pill">🎯 ${day[1]}</span><span class="pill">✅ Validation ≥ 90 %</span>${state.done[i]?'<span class="pill">🏆 Déjà validé</span>':''}</div></div>
<div class="section lesson"><div class="mini"><h4>📘 Cours essentiel</h4><ul>${day[3].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="mini"><h4>🧠 Vocabulaire actif</h4><div class="vocab">${day[2].map(x=>{const [a,b]=x.split(' = ');return `<div class="vrow"><span>${a}</span><span>${b}</span></div>`}).join('')}</div></div></div>
<div class="section"><h3>🗣 Mission orale</h3><div class="mission">${day[5]}<div class="small" style="margin-top:8px">Conseil : utilise le micro de ChatGPT pour obtenir une transcription sans la corriger avant analyse.</div></div></div>
<div class="section quizWrap"><h3>📝 Contrôle de validation</h3><p class="small">10 questions. Il faut au moins 9 bonnes réponses sur 10. Tu peux recommencer autant de fois que nécessaire.</p><form id="quiz">${liveQuiz.map((q,qi)=>`<div class="q"><strong>${qi+1}. ${q.prompt}</strong><div class="options">${q.opts.map((o,oi)=>`<label class="opt"><input type="radio" name="q${qi}" value="${oi}"> <span>${o}</span></label>`).join('')}</div></div>`).join('')}<div class="actions"><button class="btn primary" type="submit">Corriger et valider</button><button class="btn secondary" type="button" id="reshuffle">Nouveau tirage</button></div></form><div id="result" class="result"></div></div>`;
 document.getElementById('quiz').onsubmit=(e)=>{e.preventDefault();let ok=0;liveQuiz.forEach((q,qi)=>{const el=document.querySelector(`input[name=q${qi}]:checked`);if(el&&Number(el.value)===q.ans)ok++});const score=Math.round(ok/liveQuiz.length*100);state.scores[i]=Math.max(score,state.scores[i]||0);const r=document.getElementById('result');if(score>=90){state.done[i]=true;r.className='result good';r.innerHTML=`<b>Validé : ${score}% 🎉</b><br>Cette journée est maintenant acquise.${i<27?' Le jour suivant est débloqué.':''}`;save();renderDays()}else{r.className='result bad';r.innerHTML=`<b>${score}% — pas encore validé.</b><br>Il faut 90%. Revois le cours puis recommence le contrôle.`;save();renderDays()}};
 document.getElementById('reshuffle').onclick=()=>render();
}
document.getElementById('resetBtn').onclick=()=>{if(confirm('Effacer toute la progression ?')){localStorage.removeItem(stateKey);state={done:{},scores:{},current:0};render()}};
render();
</script>
